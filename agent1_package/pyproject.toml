[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent1_package"
version = "0.1.0"
description = "Agent1 full package including agent1_core and agent"
authors = [
    {name = "Your Name", email = "your@email.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "langgraph>=0.2.6",
    "langchain>=0.3.19",
    "langchain-google-genai",
    "langchain_core>=0.3.46",
    "langchain_community>=0.3.20",
    "google-genai",
    "python-dotenv>=1.0.1",
    "aiohttp",
    "pydantic",
    "asyncio",
    "rich>=13.9.4",
    "pandas>=2.2.3",
    "pyyaml>=6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent1_core*", "agent*"] 